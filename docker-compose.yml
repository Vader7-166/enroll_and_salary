name: hrtp

services:
  db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrtp_demo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: hrtp_demo
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      TZ: Asia/Ho_Chi_Minh
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrtp_demo -d hrtp_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://hrtp_demo:${POSTGRES_PASSWORD}@db:5432/hrtp_demo?schema=public&connection_limit=5&connect_timeout=3&pool_timeout=3&socket_timeout=3
      HR_DATA_KEY: ${HR_DATA_KEY:?Set HR_DATA_KEY in .env}
      HOST: 0.0.0.0
      PORT: 3000
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      # Set true together with the `tls` profile; the session cookie is then sent over HTTPS only.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TZ: Asia/Ho_Chi_Minh
      # Demo seed: allow the isolated compose database and create the admin from .env.
      SEED_ALLOW_ISOLATED: "true"
      SEED_DB_HOST: db
      SEED_ADMIN_USERNAME: ${ADMIN_USERNAME:?Set ADMIN_USERNAME in .env}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SEED_ADMIN_NAME: ${ADMIN_NAME:-}
      HR_DATA_KEYS: ${HR_DATA_KEYS:-}
      HR_DATA_KEY_ACTIVE: ${HR_DATA_KEY_ACTIVE:-v1}
      AI_BUSINESS_ASSISTANT_ENABLED: ${AI_BUSINESS_ASSISTANT_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-1024}
      AI_RATE_LIMIT_PER_HOUR: ${AI_RATE_LIMIT_PER_HOUR:-20}
      AI_DAILY_REQUEST_BUDGET: ${AI_DAILY_REQUEST_BUDGET:-500}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

  # Optional HTTPS front (task 5.1): docker compose --profile tls up -d
  # Needs deploy/certs/tls.crt + tls.key (scripts/dev-tls-cert.sh makes a self-signed pair for testing),
  # COOKIE_SECURE=true and the https origin in WEB_ORIGINS.
  tls:
    image: nginx:1.28-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      TLS_PUBLIC_PORT: ${TLS_PORT:-8443}
    volumes:
      - ./deploy/nginx/tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    ports:
      - "${TLS_PORT:-8443}:443"
      - "${TLS_HTTP_PORT:-8081}:80"

  # Hourly encrypted backups (FR-X.4, RPO ≤ 1 h): docker compose --profile backup up -d
  # BACKUP_ENCRYPTION_KEY must differ from HR_DATA_KEY and be stored off this host; copy ./backups off-site.
  backup:
    build:
      context: .
      dockerfile: deploy/backup/Dockerfile
    profiles: ["backup"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: hrtp_demo
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: hrtp_demo
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?Set BACKUP_ENCRYPTION_KEY in .env for the backup profile}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_KEEP_HOURS: ${BACKUP_KEEP_HOURS:-48}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-90}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-36}
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - ${BACKUP_HOST_DIR:-./backups}:/backups

volumes:
  pgdata:
